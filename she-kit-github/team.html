    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f5f5f5;
            --border-color: #ddd;
            --accent-color: #e74c3c;
            --hover-bg: #efefef;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --border-color: #444;
            --accent-color: #e74c3c;
            --hover-bg: #3d3d3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            cursor: pointer;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--hover-bg);
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background-color: var(--hover-bg);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .team-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
        }

        .team-logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .team-info h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .team-info p {
            font-size: 16px;
            opacity: 0.7;
        }

        .kits-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .kit-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .kit-card:hover {
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .kit-type-label {
            padding: 12px 16px;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }

        .kit-image {
            width: 100%;
            height: 500px;
            background-color: var(--hover-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .kit-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .kit-image-placeholder {
            text-align: center;
            opacity: 0.5;
            font-size: 14px;
        }

        .kit-details {
            padding: 16px;
        }

        .kit-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .add-ons {
            margin-bottom: 20px;
        }

        .add-ons-title {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .add-on-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        .add-on-item input {
            cursor: pointer;
        }

        .add-on-item label {
            cursor: pointer;
            flex: 1;
        }

        .add-on-price {
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
        }

        .purchase-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .purchase-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .purchase-btn:active {
            transform: scale(0.98);
        }

        .total-price {
            text-align: center;
            font-size: 14px;
            padding: 8px 0;
            margin-top: 10px;
            color: var(--text-color);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 10px;
            }

            .team-header {
                flex-direction: column;
                text-align: center;
            }

            .team-info h1 {
                font-size: 24px;
            }

            .kits-grid {
                grid-template-columns: 1fr;
            }

            .kit-image {
                height: 400px;
            }

            header {
                padding: 15px 20px;
            }

            .logo-text {
                font-size: 20px;
            }
        }
    </style>
</head>
