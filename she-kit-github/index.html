<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>She-Kit Store - חנות חולצות</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --card-bg: #f5f5f5;
            --border-color: #ddd;
            --accent-color: #e74c3c;
            --hover-bg: #efefef;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
            --border-color: #444;
            --accent-color: #e74c3c;
            --hover-bg: #3d3d3d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 100;
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background-color: var(--hover-bg);
        }

        .container {
            display: flex;
            min-height: calc(100vh - 80px);
        }

        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .sidebar {
            width: 280px;
            background-color: var(--card-bg);
            padding: 20px;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .team-list {
            list-style: none;
        }

        .team-item {
            padding: 12px 10px;
            margin-bottom: 8px;
            background-color: var(--bg-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-item:hover {
            background-color: var(--hover-bg);
            border-color: var(--accent-color);
        }

        .team-item img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .team-item-name {
            font-size: 13px;
            word-break: break-word;
        }

        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .league-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .league-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }

        .league-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .league-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .league-team-count {
            font-size: 13px;
            color: var(--accent-color);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-color);
            opacity: 0.6;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .main-content {
                padding: 20px;
            }

            .leagues-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            header {
                padding: 15px 20px;
            }

            .logo-text {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                display: none;
            }

            .leagues-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }

            header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-text">🛍️ She-Kit Store</div>
        <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    </header>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-title">קבוצות שנבחרו</div>
            <ul class="team-list" id="selectedTeams">
                <li style="opacity: 0.5; padding: 12px 10px;">בחר קבוצה מלמטה</li>
            </ul>
        </div>

        <div class="main-content">
            <div id="leaguesContainer"></div>
        </div>
    </div>

                ]
            },
            "super-lig": {
                "name": "Super Lig",
                "logo": "https://upload.wikimedia.org/wikipedia/en/c/cd/Super_Lig_logo.svg",
                "teams": [
                    {"id": "besiktas", "name": "Beşiktaş", "logo": "https://upload.wikimedia.org/wikipedia/en/8/8c/Besiktas_JK_logo.svg"},
                    {"id": "fenerbahce", "name": "Fenerbahçe", "logo": "https://upload.wikimedia.org/wikipedia/en/0/0a/Fenerbah%C3%A7e_SK_logo.svg"},
                    {"id": "galatasaray", "name": "Galatasaray", "logo": "https://upload.wikimedia.org/wikipedia/en/9/9f/Galatasaray_logo.svg"},
                    {"id": "trabzonspor", "name": "Trabzonspor", "logo": "https://upload.wikimedia.org/wikipedia/en/a/a4/Trabzonspor_logo.svg"}
                ]
            }
        };

        const leagueOrder = ["bundesliga", "eredivisie", "la-liga", "ligue1", "premier-league", "primeira-liga", "serie-a", "super-lig"];

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            htmlElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '☀️ Light';
        }

        themeToggle.addEventListener('click', () => {
            const theme = htmlElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
        });

        // Render leagues
        function renderLeagues() {
            const container = document.getElementById('leaguesContainer');
            let html = '<div class="leagues-grid">';

            leagueOrder.forEach(leagueId => {
                const league = teamsData[leagueId];
                html += `
                    <div class="league-card" onclick="selectLeague('${leagueId}')">
                        <img src="${league.logo}" alt="${league.name}" class="league-logo" onerror="this.style.display='none'">
                        <div class="league-name">${league.name}</div>
                        <div class="league-team-count">${league.teams.length} קבוצות</div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Select league and show teams
        function selectLeague(leagueId) {
            const league = teamsData[leagueId];
            updateSelectedTeams(league.teams);
            window.location.href = `league.html?id=${leagueId}`;
        }

        // Update sidebar with selected teams
        function updateSelectedTeams(teams) {
            const list = document.getElementById('selectedTeams');
            list.innerHTML = '';

            teams.forEach(team => {
                const li = document.createElement('li');
                li.className = 'team-item';
                li.innerHTML = `
                    <img src="${team.logo}" alt="${team.name}" onerror="this.style.display='none'">
                    <span class="team-item-name">${team.name}</span>
                `;
                li.addEventListener('click', () => {
                    window.location.href = `team.html?id=${team.id}`;
                });
                list.appendChild(li);
            });
        }

        // Initial render
        renderLeagues();
    </script>
</body>
</html>
